services:
  db:
    image: postgres:16
    container_name: backtester_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: backtester
      POSTGRES_PASSWORD: backtester_pw
      POSTGRES_DB: backtester
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
